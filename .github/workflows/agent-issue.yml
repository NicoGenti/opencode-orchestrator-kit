name: agent-issue
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: agent-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          ACTOR: ${{ github.event.sender.login }}
          ASSOC: ${{ github.event.comment.author_association || '' }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login || '' }}
          ISSUE_ASSOC: ${{ github.event.issue.author_association || '' }}
          LABEL: ${{ github.event.label.name || '' }}
          BODY: ${{ github.event.comment.body || '' }}
          IS_PR: ${{ github.event.issue.pull_request && 'yes' || 'no' }}
          LABELS: ${{ toJSON(github.event.issue.labels) }}
        run: |
          set -euo pipefail
          allow=false; want=false; mirror=false; issue_ok=false
          if [[ "$ACTOR" == "NicoGenti" || "$ASSOC" == "OWNER" || "$ASSOC" == "MEMBER" ]]; then allow=true; fi
          # The issue body becomes agent input, so its author must be trusted too,
          # not only the person who labels the issue or comments /agent.
          if [[ "$ISSUE_AUTHOR" == "NicoGenti" || "$ISSUE_ASSOC" == "OWNER" || "$ISSUE_ASSOC" == "MEMBER" ]]; then issue_ok=true; fi
          if [[ "$LABEL" == "agent:run" ]] || [[ "$BODY" == /agent* ]]; then want=true; fi
          if printf '%s' "$LABELS" | grep -q 'plan:mirror'; then mirror=true; fi
          if [[ "$allow" == true && "$want" == true && "$IS_PR" == "no" && "$issue_ok" == true ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "gate: allow=$allow want=$want is_pr=$IS_PR issue_ok=$issue_ok mirror=$mirror -> skip"
          fi

  run-agent:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Secrets are NOT defined at job level: every step gets only what it needs.
    # The agent step receives OPENCODE_API_KEY and no GitHub token.
    env:
      ISSUE: ${{ github.event.issue.number }}
      MODEL: opencode/mimo-v2.6-flash-free
      KIT_SHA: dbd41c7cd9eb411c31203530b0e5fbea800c03ff
      BASE: ${{ github.event.repository.default_branch }}
      OPENCODE_PERMISSION: '{"*":"allow","shell":"allow","webfetch":"deny","question":"deny"}'
      # Text of the "/agent ..." comment (empty for label-triggered runs). Passed via env, never interpolated into scripts.
      SCOPE_RAW: ${{ github.event.comment.body || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install OpenCode 2 (pinned)
        run: |
          set -euo pipefail
          npm i -g @opencode/cli@2.0.32
          opencode --version
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the kit at the pinned commit
        run: |
          set -euo pipefail
          git init -q /tmp/kit
          git -C /tmp/kit remote add origin https://github.com/NicoGenti/opencode-orchestrator-kit
          git -C /tmp/kit fetch -q --depth 1 origin "$KIT_SHA"
          git -C /tmp/kit checkout -q FETCH_HEAD
          test "$(git -C /tmp/kit rev-parse HEAD)" = "$KIT_SHA"
          echo "kit HEAD verified: $KIT_SHA"
      - name: Build the CI model profile (install.sh seeds it only if missing)
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib
          tpl = json.loads(pathlib.Path("/tmp/kit/templates/models.config.json").read_text(encoding="utf-8"))
          ci = json.loads(pathlib.Path(".github/agent/ci-free.json").read_text(encoding="utf-8"))
          tpl.setdefault("presets", {}).update(ci)
          tpl["default_preset"] = "ci-free"
          out = pathlib.Path(os.path.expanduser("~/.config/opencode/models.config.json"))
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(tpl, indent=2), encoding="utf-8")
          print("default_preset:", tpl["default_preset"], "->", out)
          PY
      - name: Install the kit globally (ephemeral, validation skipped)
        run: |
          set -euo pipefail
          bash /tmp/kit/install.sh --skip-validation global
          test -f "$HOME/.config/opencode/AGENTS.md"
          test -f "$HOME/.config/opencode/agents/orchestrator.md"
          if grep -rq "{{TIER_" "$HOME/.config/opencode/agents"; then
            echo "ERROR: unresolved {{TIER_ tokens found in agent files" >&2; exit 1
          fi
          grep -m1 "^model:" "$HOME/.config/opencode/agents/orchestrator.md"
      - name: Adopt the issue into the board if needed (PC-independent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PLAN=$(grep -rlE $'^gh_issue: '"${ISSUE}"$'\r?$' plan/draft plan/in-progress plan/qa 2>/dev/null | head -1 || true)
          if [ -n "$PLAN" ]; then
            echo "plan already present: $PLAN"
            exit 0
          fi
          echo "no plan for #$ISSUE: automatic adoption"
          gh issue edit "$ISSUE" -R "$GITHUB_REPOSITORY" --add-label "plan:mirror" --add-label "plan:draft" || true
          python scripts/issue_bridge.py pull --repo . --board plan             --remote "$GITHUB_REPOSITORY" --board-tool scripts/plan-board.py --json
          # main is protected by a ruleset (pull_request required) and the GITHUB_TOKEN cannot bypass it.
          # The adopted plan stays in the worktree and travels with the agent/issue-N branch; it reaches
          # main when the PR is merged, together with the code.
          git config user.name  "issue-bridge"
          git config user.email "issue-bridge@users.noreply.github.com"
          git add plan
          echo "plan adopted in the worktree (no direct push to $BASE)"
      - name: Resolve the plan file bound to the issue (pre-run, for the prompt)
        id: plan
        run: |
          set -euo pipefail
          PLAN=$(grep -rlE $'^gh_issue: '"${ISSUE}"$'\r?$' plan/draft plan/in-progress plan/qa | head -1)
          echo "file=$PLAN" >> "$GITHUB_OUTPUT"
          test -n "$PLAN"
      - name: Install dependencies (frozen)
        run: bun install --frozen-lockfile
      - name: Refuse to reuse an existing agent branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" ls-remote --exit-code origin "refs/heads/agent/issue-${ISSUE}" >/dev/null 2>&1; then
            echo "ERROR: branch agent/issue-${ISSUE} already exists on origin." >&2
            echo "Delete it first, or use a new issue for this run." >&2
            exit 1
          fi
      - name: Run the agent
        id: agent
        # A stop or timeout must not skip the steps that save the work.
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          git config user.name  "issue-bridge"
          git config user.email "issue-bridge@users.noreply.github.com"
          git checkout -b "agent/issue-${ISSUE}"
          SCOPE="$(printf '%s' "$SCOPE_RAW" | head -n1 | sed -E 's#^/agent[[:space:]]*##')"
          if [ -z "$SCOPE" ]; then SCOPE="the whole plan"; fi
          echo "scope: $SCOPE"
          # Hard stop 15 minutes before the job timeout so verify/commit/push still run.
          timeout --signal=INT 75m opencode run --agent build -m "$MODEL" \
            "$(cat .github/agent/agent-issue.md)

          Work on the plan: ${{ steps.plan.outputs.file }}
          GitHub issue: #${ISSUE}
          Scope: ${SCOPE}
          Stop after the requested scope: do not start later phases, and leave the working tree in a consistent state.

          Execution rules:
          - Execute the requested phases sequentially.
          - Do not dispatch parallel implementation agents when they can modify shared integration surfaces.
          - After each phase, run: bun run typecheck && bun test && bun run lint.
          - Fix only failures caused by the current phase before continuing.
          - Do not mark a phase complete unless its checks pass.

          Constraint: do not create or modify any file under .github/workflows/ (the runner token cannot push workflow changes)." | tee /tmp/agent.log
      - name: Re-resolve the plan and run quality gates
        id: after
        if: always() && steps.agent.outcome != 'skipped'
        run: |
          set -euo pipefail
          PLAN=$(grep -rlE $'^gh_issue: '"${ISSUE}"$'\r?$' plan/qa plan/in-progress plan/draft 2>/dev/null | head -1 || true)
          echo "file=$PLAN" >> "$GITHUB_OUTPUT"
          if [ -n "$PLAN" ]; then
            echo -n "status in the plan file: "; grep -m1 "^status:" "$PLAN" || true
          else
            echo "::warning::plan file not found after the run"
          fi
          bun install --frozen-lockfile
          bun run typecheck
          bun test
          bun run lint
      - name: Redact the agent log before publication
        if: always()
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          test -f /tmp/agent.log
          cp /tmp/agent.log /tmp/agent-redacted.log
          if [ -n "${OPENCODE_API_KEY:-}" ]; then
            python - "$OPENCODE_API_KEY" <<'PY'
          import pathlib, sys
          secret = sys.argv[1]
          path = pathlib.Path("/tmp/agent-redacted.log")
          text = path.read_text(encoding="utf-8", errors="replace")
          text = text.replace(secret, "[REDACTED]")
          path.write_text(text, encoding="utf-8")
          PY
          fi
          # Defense in depth: mask common provider key shapes even if the
          # exact secret value was not present verbatim.
          sed -E -i \
            -e 's/(sk-[A-Za-z0-9_-]{8,})/[REDACTED]/g' \
            -e 's/(gh[pousr]_[A-Za-z0-9_]{20,})/[REDACTED]/g' \
            -e 's/(Bearer[[:space:]]+)[A-Za-z0-9._-]{20,}/\1[REDACTED]/g' \
            /tmp/agent-redacted.log
          echo "redacted log ready: /tmp/agent-redacted.log"
      - name: Mirror the board into the issue BEFORE committing (machine keys travel with the branch)
        if: always() && steps.agent.outcome != 'skipped'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python scripts/issue_bridge.py push --repo . --board plan \
            --remote "$GITHUB_REPOSITORY" --board-tool scripts/plan-board.py --json
      - name: Commit and push the branch
        if: always() && steps.agent.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git add -A
          # GITHUB_TOKEN cannot push changes under .github/workflows/. Discard any
          # such change made by the agent so the rest of the work is not lost.
          git diff --cached --name-only --no-renames -- .github/workflows > /tmp/blocked-workflows.txt || true
          if [ -s /tmp/blocked-workflows.txt ]; then
            echo "::warning::Discarding agent changes under .github/workflows/ (not pushable with GITHUB_TOKEN)"
            cat /tmp/blocked-workflows.txt
            while IFS= read -r f; do
              git reset -q HEAD -- "$f"
              git checkout -q HEAD -- "$f" 2>/dev/null || rm -f "$f"
            done < /tmp/blocked-workflows.txt
          fi
          git commit -m "feat(issue-${ISSUE}): agent execution of $(basename "${{ steps.after.outputs.file }}")" \
            || echo "no changes to commit"
          # Credentials are not persisted by checkout: pass them only to this push.
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push -u origin "agent/issue-${ISSUE}"
      - name: Open or reuse the pull request
        if: always() && steps.agent.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR=$(gh pr list -R "$GITHUB_REPOSITORY" --head "agent/issue-${ISSUE}" --json url --jq '.[0].url')
          if [[ -z "$PR" ]]; then
            gh pr create --draft --base "$BASE" --head "agent/issue-${ISSUE}" \
              --title "agent: issue #${ISSUE}" \
              --body "$(printf 'Automated execution of plan %s (issue #%s).\n\nAgent log: see the workflow run logs for this execution.\n' \
                        "${{ steps.after.outputs.file }}" "${ISSUE}")"
          else
            echo "PR already exists: $PR"
          fi
      - name: Comment the outcome on the issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          AGENT_OUTCOME="${{ steps.agent.outcome }}"
          if [[ "${{ job.status }}" == "success" && "$AGENT_OUTCOME" == "success" ]]; then
            MSG="execution completed"
          elif [[ "$AGENT_OUTCOME" == "failure" && "${{ job.status }}" == "success" ]]; then
            MSG="execution stopped early (agent error or time limit); partial work was pushed to agent/issue-${ISSUE} as a draft PR"
          else
            MSG="execution failed"
          fi
          printf '%s\n\nAgent log: see the [workflow run logs](%s).\n' "$MSG" "$RUN_URL" > /tmp/report.md
          if [ -s /tmp/blocked-workflows.txt ]; then
            printf '\nChanges to these workflow files were discarded because the runner token cannot push them:\n' >> /tmp/report.md
            while IFS= read -r f; do printf -- '- `%s`\n' "$f" >> /tmp/report.md; done < /tmp/blocked-workflows.txt
          fi
          gh issue comment "${ISSUE}" -R "$GITHUB_REPOSITORY" --body-file /tmp/report.md
