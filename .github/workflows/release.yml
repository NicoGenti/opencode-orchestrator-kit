# Publishes plugin/ to npm when a v* tag is pushed, through npm Trusted
# Publishing (OIDC) instead of a long-lived token.
# Does not run on pull requests or on pushes to main, so it is safe to merge
# without publishing. The tag (without the leading v) must equal
# plugin/package.json "version".
#
# The flow is branch-first: `main` is development only, a release is cut on
# `release/<tag>` (branched from main, version bump committed there), and the
# tag is created on that branch's head, never on main. The first step after the
# checkout fails — before every quality gate, the tag↔version check, the npm
# upgrade and the publish step — unless `origin/release/<tag>` exists and its
# head is exactly the commit the tag points at. Annotations are peeled with
# `git rev-parse <tag>^{commit}`, because `github.sha` on an annotated-tag push
# is not the commit the tag names. The checkout uses fetch-depth 0 so the tag
# object is fully available locally for that peel.
#
# After the publish succeeds, the run creates the GitHub Release for that tag,
# using the complete `[x.y.z]` section of CHANGELOG.md as the notes. The job
# therefore carries a job-level permissions block with `contents: write` (to
# create the release) and `id-token: write` (for the OIDC exchange): job-level
# permissions replace the top-level block instead of extending it, so both
# entries are repeated there. The top-level block stays read-only for contents.
#
# Precondition (human step, not automated here, not registered yet): a trusted
# publisher must be registered on npmjs.com for this repository:
#   repository:        NicoGenti/opencode-orchestrator-kit
#   workflow filename: release.yml
#   environment:       npm
#   Allowed actions:   npm publish
# Publisher configurations created after 2026-09-03 are stage-only and must be
# enabled for the `npm publish` action. A publisher configuration that is not
# validated expires 2 days after it was created, so register (or re-create) the
# publisher within 2 days of pushing the tag. If the publish fails because the
# publisher is missing or expired, fix the registration and re-run the failed
# job from the GitHub UI; the tag and the version must not change.
# The publish job runs in that environment, so a required reviewer approves it
# before it starts, and it authenticates with the short-lived OIDC token
# granted by the id-token: write permission. No stored npm token is read.
# Trusted publishing needs npm >= 11.5.1 on Node >= 22.14.0, so the job upgrades
# npm right before publishing, logs the resolved version and fails when that
# version is below the 11.5.1 floor.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: quality gates and npm publish
    runs-on: ubuntu-latest
    environment: npm
    # Job-level permissions replace the top-level ones: contents: write is
    # needed to create the GitHub Release after the publish, id-token: write is
    # needed for the Trusted Publishing OIDC exchange.
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the annotated tag object is present locally and
          # `git rev-parse <tag>^{commit}` peels it without a network round trip
          # (a depth-1 tag fetch is not guaranteed to carry the tag object).
          fetch-depth: 0

      # Branch-first gate — the first step after the checkout on purpose: no
      # quality gate, tag check, npm upgrade or publish step runs unless the
      # release branch exists and sits exactly on the commit the tag names.
      - name: Verify the release branch matches the tag
        run: |
          set -euo pipefail
          BRANCH="release/${GITHUB_REF_NAME}"
          REMOTE_HEAD="$(git ls-remote --heads origin "refs/heads/${BRANCH}" | cut -f1)"
          if [ -z "${REMOTE_HEAD}" ]; then
            echo "::error::release branch ${BRANCH} does not exist on origin; cut it from main, commit the version bump there and push it before tagging ${GITHUB_REF_NAME}"
            exit 1
          fi
          if ! TAG_COMMIT="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"; then
            echo "::error::cannot resolve ${GITHUB_REF_NAME} to a commit; the tag must exist in the checkout"
            exit 1
          fi
          if [ "${REMOTE_HEAD}" != "${TAG_COMMIT}" ]; then
            echo "::error::release branch ${BRANCH} head is ${REMOTE_HEAD} but tag ${GITHUB_REF_NAME} points at ${TAG_COMMIT}; tag the release branch head, never a different commit"
            exit 1
          fi
          echo "release branch ${BRANCH} head ${REMOTE_HEAD} matches tag ${GITHUB_REF_NAME} commit ${TAG_COMMIT}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # freellmapi-profile.test.ts invokes `python`. setup-python usually
      # provides that name; if a runner only has python3, alias it.
      - name: Alias python to python3 when python is missing
        run: |
          set -euo pipefail
          if ! command -v python >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/bin"
            ln -sf "$(command -v python3)" "$HOME/.local/bin/python"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          python3 --version
          python --version

      # No custom registry is configured on purpose: pointing setup-node at a
      # private registry writes an `_authToken` placeholder into the runner's
      # npm config, and that placeholder breaks the OIDC token exchange used
      # by trusted publishing. npm keeps its default registry.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Check packaged assets
        run: bun run sync-assets --check

      - name: Verify the tag matches plugin/package.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./plugin/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match plugin/package.json version ${PKG}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches plugin version ${PKG}"

      # Trusted publishing requires npm >= 11.5.1 (and Node >= 22.14.0); the
      # runner image ships an older npm, so upgrade it right before publishing,
      # log the resolved version and fail loudly when it is below the floor.
      - name: Upgrade npm for trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@latest
          NPM_VERSION="$(npm --version)"
          echo "npm version: ${NPM_VERSION}"
          node -e '
            const [major = 0, minor = 0, patch = 0] = process.argv[1]
              .split(".")
              .map((p) => Number.parseInt(p, 10));
            const current = major * 1e6 + minor * 1e3 + patch;
            const floor = 11 * 1e6 + 5 * 1e3 + 1;
            if (current < floor) {
              console.error(
                "::error::npm " + process.argv[1] + " is below the 11.5.1 floor required by trusted publishing",
              );
              process.exit(1);
            }
          ' "${NPM_VERSION}"

      - name: Publish plugin/ to npm
        working-directory: plugin
        run: npm publish --provenance --access public

      # Automatic GitHub Release, notes taken from the complete `[x.y.z]`
      # CHANGELOG.md section (the promoted heading down to the next `## `
      # heading). The heading itself is dropped because the release title
      # already carries the tag. Uses the built-in workflow token, so no extra
      # secret is involved.
      - name: Create the GitHub Release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="${RUNNER_TEMP}/release-notes.md"
          awk -v heading="## [${VERSION}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "${NOTES}"
          if ! grep -q '[^[:space:]]' "${NOTES}"; then
            echo "::error::CHANGELOG.md carries no ## [${VERSION}] section to publish as the release notes"
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${NOTES}"
