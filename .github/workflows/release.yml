# Publishes plugin/ to npm when a v* tag is pushed, through npm Trusted
# Publishing (OIDC) instead of a long-lived token.
# Does not run on pull requests or on pushes to main, so it is safe to merge
# without publishing. The tag (without the leading v) must equal
# plugin/package.json "version".
#
# Trusted publisher registered on npmjs.com for this repository:
#   repository:  NicoGenti/opencode-orchestrator-kit
#   workflow:    .github/workflows/release.yml
#   environment: npm
#   command:     npm publish
# The publish job runs in that environment, so a required reviewer approves it
# before it starts, and it authenticates with the short-lived OIDC token
# granted by the id-token: write permission. No stored npm token is read.
# Trusted publishing needs npm >= 11.5.1 on Node >= 22.14.0, so the job upgrades
# npm and logs its version before publishing.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: quality gates and npm publish
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # freellmapi-profile.test.ts invokes `python`. setup-python usually
      # provides that name; if a runner only has python3, alias it.
      - name: Alias python to python3 when python is missing
        run: |
          set -euo pipefail
          if ! command -v python >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/bin"
            ln -sf "$(command -v python3)" "$HOME/.local/bin/python"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          python3 --version
          python --version

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing requires npm >= 11.5.1 (and Node >= 22.14.0); the
      # runner image ships an older npm, so upgrade it and log the version.
      - name: Upgrade npm for trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Check packaged assets
        run: bun run sync-assets --check

      - name: Verify the tag matches plugin/package.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./plugin/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match plugin/package.json version ${PKG}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches plugin version ${PKG}"

      - name: Publish plugin/ to npm
        working-directory: plugin
        run: npm publish --provenance --access public
