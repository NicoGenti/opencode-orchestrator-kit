# Publishes plugin/ to npm when a v* tag is pushed.
# Does not run on pull requests or on pushes to main, so it is safe to merge
# before the NPM_TOKEN secret exists. Creating the secret is required only
# when the first tag is pushed. The tag (without the leading v) must equal
# plugin/package.json "version".

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: quality gates and npm publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # freellmapi-profile.test.ts invokes `python`. setup-python usually
      # provides that name; if a runner only has python3, alias it.
      - name: Alias python to python3 when python is missing
        run: |
          set -euo pipefail
          if ! command -v python >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/bin"
            ln -sf "$(command -v python3)" "$HOME/.local/bin/python"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          python3 --version
          python --version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Check packaged assets
        run: bun run sync-assets --check

      - name: Verify the tag matches plugin/package.json
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./plugin/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match plugin/package.json version ${PKG}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches plugin version ${PKG}"

      - name: Publish plugin/ to npm
        working-directory: plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
