name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: bun test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # freellmapi-profile.test.ts invokes `python`. setup-python usually
      # provides that name; if a runner only has python3, alias it.
      - name: Alias python to python3 when python is missing
        run: |
          set -euo pipefail
          if ! command -v python >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/bin"
            ln -sf "$(command -v python3)" "$HOME/.local/bin/python"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          python3 --version
          python --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Check packaged assets are in sync
        run: bun run sync-assets --check

      - name: Build the docs site
        run: bun run build

      - name: Run tests
        run: bun test
