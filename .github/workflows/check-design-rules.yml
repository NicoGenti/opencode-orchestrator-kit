name: Check design rules

# Diff templates/design-rules.md against web-kit docs/design-rules-ui.md.
# Weekly and manual only. Not part of the pull-request test workflow:
# unit tests must not need network, and this job fetches GitHub.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: DR-UI rules match web-kit main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Diff the rules section
        run: bun run check-design-rules
